upstream backend {
    zone backend 64k;
    resolver 127.0.0.11 valid=10s;
    server backend:3000 resolve;
}

upstream frontend {
    zone frontend 64k;
    resolver 127.0.0.11 valid=10s;
    server frontend:8100 resolve;
}

upstream pushpin {
    zone pushpin 64k;
    resolver 127.0.0.11 valid=10s;
    server pushpin:7999 resolve;
}

upstream www {
    zone www 64k;
    resolver 127.0.0.11 valid=10s;
    server www:4321 resolve;
}

server {
    client_max_body_size 3G;

	  listen 80 default_server;

	  server_name localhost;

    location /grip/ws {
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_connect_timeout 1h;
        proxy_send_timeout 1h;
        proxy_read_timeout 1h;
        proxy_pass http://pushpin/ws;
    }

    location /api/ {
        proxy_pass http://backend/;
    }

    location /app/api/ {
        proxy_pass http://backend/;
    }

    location /app/ {
        proxy_pass http://frontend/app/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    location = /service-worker.js {
        proxy_pass http://frontend/app/service-worker.js;
    }

    location = /manifest.json {
        proxy_pass http://frontend/app/manifest.json;
    }

	  location / {
        proxy_pass http://www;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
	  }
}
