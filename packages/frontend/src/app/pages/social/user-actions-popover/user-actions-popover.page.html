<ion-list no-border>
  <ion-button
    (click)="closeWithAction('report')"
    expand="block"
    size="small"
    color="danger"
    class="ion-margin"
  >
    <ion-icon name="flag-outline" slot="start"></ion-icon>
    {{ "pages.userActionsPopover.report" | translate }}
  </ion-button>

  @if (isBlockedByMe) {
    <ion-button
      (click)="closeWithAction('unblock')"
      expand="block"
      size="small"
      class="ion-margin"
    >
      <ion-icon name="ban-outline" slot="start"></ion-icon>
      {{ "pages.userActionsPopover.unblock" | translate }}
    </ion-button>
  } @else {
    <ion-button
      (click)="closeWithAction('block')"
      expand="block"
      size="small"
      color="danger"
      class="ion-margin"
    >
      <ion-icon name="ban-outline" slot="start"></ion-icon>
      {{ "pages.userActionsPopover.block" | translate }}
    </ion-button>
  }
</ion-list>
