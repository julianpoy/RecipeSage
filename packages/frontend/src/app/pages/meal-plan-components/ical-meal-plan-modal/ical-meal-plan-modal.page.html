<ion-header>
  <ion-toolbar>
    <ion-title> {{ "pages.icalMealPlanModal.title" | translate }} </ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding grouped-content">
  <p class="ion-no-margin">
    {{ "pages.icalMealPlanModal.description" | translate }}
  </p>

  <copy-with-webshare
    [webshareURL]="icalURL"
    [copyText]="icalURL"
  ></copy-with-webshare>
</ion-content>

<ion-footer class="ion-padding">
  <ion-button expand="block" (click)="close()">
    <ion-icon name="close-outline" slot="start"></ion-icon>
    <ion-label> {{ "generic.close" | translate }} </ion-label>
  </ion-button>
</ion-footer>
