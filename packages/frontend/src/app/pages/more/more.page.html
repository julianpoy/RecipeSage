<ion-header [translucent]="true">
  <ion-toolbar color="nav">
    <ion-title>{{ "pages.more.title" | translate }}</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" class="grouped-content">
  <div class="page-wrapper">
    <ion-list inset="true">
      <ion-item-group>
        @for (p of navList; track p.id) {
          <ion-item
            [routerDirection]="'forward'"
            [routerLink]="[p.url]"
            [state]="{ showBack: true }"
            detail
          >
            <ion-icon slot="start" [name]="p.icon"></ion-icon>
            <ion-label class="ion-text-wrap">
              {{ p.title }}
            </ion-label>
            @if (p.id === "people" && moreTabBadgeCount()) {
              <ion-badge slot="end">{{ moreTabBadgeCount() }}</ion-badge>
            }
          </ion-item>
        }
      </ion-item-group>
    </ion-list>

    <div class="app-info">
      @if (isSelfHost) {
        <p class="app-name">RecipeSage Self Hosted</p>
      } @else {
        <img
          class="app-logo light-logo"
          src="assets/recipesage-black-trimmed.png"
          alt="RecipeSage"
        />
        <img
          class="app-logo dark-logo"
          src="assets/recipesage-white-trimmed.png"
          alt="RecipeSage"
        />
      }
      @if (appVersion) {
        <p>{{ appVersion }}</p>
      }
      <a [routerLink]="[aboutDetailsHref]">Julian Poyourow</a>
    </div>
  </div>
</ion-content>
