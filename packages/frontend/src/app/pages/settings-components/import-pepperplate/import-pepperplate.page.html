<ion-header [translucent]="true">
  <ion-toolbar color="nav">
    <ion-buttons slot="start">
      <ion-back-button [defaultHref]="defaultBackHref"></ion-back-button>
    </ion-buttons>

    <ion-title>{{ "pages.importPepperplate.title" | translate }}</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" class="ion-padding grouped-content">
  <div class="page-wrapper">
    <ion-list inset="true">
      <ion-item-group>
        <ion-item lines="none">
          <ion-label class="ion-text-wrap">
            {{ "pages.importPepperplate.description" | translate }}
            <br /><br />
            <a
              href="https://docs.recipesage.com/docs/tutorials/settings/import/pepperplate"
              target="_blank"
              rel="noopener"
              >{{ "pages.import.viewDocumentation" | translate }}</a
            >
          </ion-label>
        </ion-item>
      </ion-item-group>
    </ion-list>

    <text-input
      label="{{ 'pages.importPepperplate.username' | translate }}"
      helperText="{{
        'pages.importPepperplate.username.helperText' | translate
      }}"
      [(ngModel)]="username"
      autocomplete="off"
      [spellcheck]="false"
    ></text-input>

    <br />

    <text-input
      label="{{ 'pages.importPepperplate.password' | translate }}"
      helperText="{{
        'pages.importPepperplate.password.helperText' | translate
      }}"
      [(ngModel)]="password"
      type="password"
      autocomplete="new-password"
      [spellcheck]="false"
    ></text-input>

    <br />

    <ion-button (click)="submit()">
      {{ "generic.submit" | translate }}
    </ion-button>
  </div>
</ion-content>
