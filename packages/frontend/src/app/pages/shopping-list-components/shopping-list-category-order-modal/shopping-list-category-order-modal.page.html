<ion-header>
  <ion-toolbar>
    <ion-title>{{
      "pages.shoppingListCategoryOrderModal.title" | translate
    }}</ion-title>

    <ion-buttons slot="end">
      <ion-button (click)="close()">
        <ion-icon name="close-outline" slot="icon-only"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding grouped-content">
  <p class="ion-no-margin">
    {{ "pages.shoppingListCategoryOrderModal.description" | translate }}
  </p>
  <p>
    <ion-note>
      {{ "pages.shoppingListCategoryOrderModal.instructions" | translate }}
    </ion-note>
  </p>

  <text-area
    label="{{ 'pages.shoppingListCategoryOrderModal.label' | translate }}"
    placeholder="{{
      'pages.shoppingListCategoryOrderModal.placeholder' | translate
    }}"
    [(ngModel)]="categoryOrder"
    [rows]="8"
    [autoGrow]="true"
  ></text-area>
</ion-content>

<ion-footer class="ion-padding">
  <ion-button expand="block" (click)="save()">
    <ion-icon name="save-outline" slot="start"></ion-icon>
    <ion-label> {{ "generic.save" | translate }} </ion-label>
  </ion-button>
</ion-footer>
