<ion-content [fullscreen]="true" [forceOverscroll]="false" [scrollY]="false">
  <div class="backdrop"></div>

  <div class="viewer" #viewer>
    <swiper-container
      #swiperContainer
      [modules]="swiperModules"
      zoom="true"
      centeredSlides="true"
    >
      @for (imageUrl of imageUrls; track imageUrl) {
        <swiper-slide>
          <div class="swiper-zoom-container">
            <img [src]="imageUrl | resolveStorageLocation" />
          </div>
        </swiper-slide>
      }
    </swiper-container>
  </div>

  <div class="controls">
    <button
      type="button"
      class="control-button ion-activatable close"
      [attr.aria-label]="'generic.close' | translate"
      (click)="dismiss()"
    >
      <ion-icon name="close"></ion-icon>
      <ion-ripple-effect></ion-ripple-effect>
    </button>

    @if (imageUrls.length > 1) {
      @if (slideNum() > 0) {
        <button
          type="button"
          class="control-button ion-activatable previous"
          [attr.aria-label]="'components.imageViewer.previous' | translate"
          (click)="slidePrev()"
        >
          <ion-icon name="chevron-back"></ion-icon>
          <ion-ripple-effect></ion-ripple-effect>
        </button>
      }
      @if (slideNum() < imageUrls.length - 1) {
        <button
          type="button"
          class="control-button ion-activatable next"
          [attr.aria-label]="'components.imageViewer.next' | translate"
          (click)="slideNext()"
        >
          <ion-icon name="chevron-forward"></ion-icon>
          <ion-ripple-effect></ion-ripple-effect>
        </button>
      }

      <div class="page-dots" aria-hidden="true">
        @for (imageUrl of imageUrls; track imageUrl; let i = $index) {
          <span class="page-dot" [class.active]="i === slideNum()"></span>
        }
      </div>
    }
  </div>
</ion-content>
