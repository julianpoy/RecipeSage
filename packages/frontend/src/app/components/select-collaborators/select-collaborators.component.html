<div>
  <h6>{{ "components.selectCollaborators.title" | translate }}</h6>

  <div class="labels">
    @for (userId of selectedCollaboratorIds; track userId) {
      <ion-chip (click)="removeCollaborator(userId)">
        <ion-label>
          {{ userProfilesById.get(userId)?.name || "--" }}
        </ion-label>
        <ion-icon name="trash-outline" color="danger"></ion-icon>
      </ion-chip>
    }
  </div>

  <select-user
    (selectedUserChange)="addCollaborator($event)"
    [enableSelectedMode]="false"
    [excludeUserIds]="selectedCollaboratorIds"
  ></select-user>
</div>
