<div
  class="gsi-container"
  #googleButtonContainer
  [hidden]="isElectron || isNative"
></div>
@if (isElectron || isNative) {
  <ion-button
    expand="block"
    fill="solid"
    color="dark"
    (click)="startExternalGoogleSignIn()"
  >
    {{ "components.signInWithGoogle.button" | translate }}
  </ion-button>
}
